version: '3.3'

services:
  # --- 数据库服务 ---
  mysql:
    image: mysql:8.0          # 使用 MySQL 8.0 官方镜像
    container_name: nestjs-mysql
    restart: always           # 容器崩溃自动重启
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # 从 .env 读取 root 密码
      MYSQL_DATABASE: ${DB_DATABASE}               # 自动创建数据库
      MYSQL_USER: ${DB_USERNAME}                   # 自动创建普通用户
      MYSQL_PASSWORD: ${DB_PASSWORD}           # 用户密码
    ports:
      - "3306:3306"           # 映射端口，方便本地客户端连接（生产环境可注释掉）
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化：将数据保存在 Docker 卷中
    networks:
      - app-network
    healthcheck:              # 健康检查，确保数据库启动成功后再启动应用
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- NestJS 应用服务 ---
  api:
    build: .                  # 使用当前目录的 Dockerfile 构建
    container_name: nestjs-app
    restart: always
    ports:
      - "3000:3000"           # 映射应用端口
    environment:
      # 关键：在这里配置数据库连接信息
      # 注意：DB_HOST 必须填写 docker-compose 中定义的服务名 'mysql'，而不是 localhost
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      NODE_ENV: production
    depends_on:
      - mysql                 # 简化为数组格式，兼容旧版本 Docker Compose
    networks:
      - app-network

# --- 定义网络和存储卷 ---
networks:
  app-network:
    driver: bridge

volumes:
  mysql-data: # 命名卷，Docker 会自动管理，数据不会随容器删除而丢失